services:


  web:
    build:
      context: ${NAILD_WEBAPP_PATH:-../Naild-WebApp/naild-website}
      dockerfile: Dockerfile.web.dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:8080}
      NEXT_PUBLIC_AI_BASE: ${NEXT_PUBLIC_AI_BASE:-http://localhost:8081}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ${NAILD_WEBAPP_PATH:-../Naild-WebApp/naild-website}:/app
      - /app/node_modules
    depends_on:
      - python_backend
      - springboot

  python_backend:
    build:
      context: ${NAILD_WEBAPP_PATH:-../Naild-WebApp/naild-website}
      dockerfile: python_backend/Dockerfile
    ports:
      - "8081:8081"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      SPRING_API_BASE: ${SPRING_API_BASE:-http://springboot:8080/api/v1}
    volumes:
      - ${NAILD_WEBAPP_PATH:-../Naild-WebApp/naild-website}/python_backend:/app

  springboot:
    build:
      context: ${SPRINGBOOT_PATH:-../security}
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/User}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-REMOVED-ROTATED-DB-PASSWORD}

